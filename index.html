<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可乐3岁生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#fff7e0,#ffe8f0);}
.title-wrap{position:absolute;top:8vh;width:100%;text-align:center;z-index:10;pointer-events:none;}
.big-num{font-size:18vw;font-weight:bold;color:#ff5040;text-shadow:0 4px 12px rgba(255,80,60,0.25);line-height:1;}
.main-text{font-size:7vw;color:#222;margin-top:12px;font-weight:600;}
.sub-text{font-size:4vw;color:#ff6858;margin-top:6px;}
/* 弹出的浮动元素 */
.float-item{
  position:absolute;
  pointer-events:none;
  animation:floatAnim 2.2s ease-out forwards;
}
@keyframes floatAnim{
  0%{transform:translate(-50%,-50%) scale(0.2);opacity:1;}
  100%{transform:translate(-50%,-150%) scale(1.1);opacity:0;}
}
</style>
</head>
<body>
<div class="title-wrap">
  <div class="big-num">3</div>
  <div class="main-text">祝可乐三岁生日快乐</div>
  <div class="sub-text">🥳 可乐三岁啦！🥳</div>
</div>

<script>
// 所有矢量内容：纯svg，无图片
const itemList = [
  `<svg width="120" height="80" viewBox="0 0 120 80"><rect x="10" y="30" width="100" height="42" rx="8" fill="#4285dd"/><circle cx="30" cy="72" r="8" fill="#222"/><circle cx="90" cy="72" r="8" fill="#222"/><rect x="85" y="18" width="22" height="16" rx="3" fill="#3377bb"/></svg>`,//小汽车塞车
  `<svg width="90" height="110" viewBox="0 0 90 110"><path d="M22,12 L68,12 L75,100 Q45,108 15,100 Z" fill="#ff3333"/><rect x="30" y="4" width="30" height="12" rx="4" fill="#cc2222"/><text x="45" y="60" font-size="18" text-anchor="middle" fill="#fff">可乐</text></svg>`,//可乐瓶子
  `<div style="font-size:36px;font-weight:bold;color:#ff4444">可乐生日快乐🎂</div>`,
  `<svg width="75" height="75" viewBox="0 0 75 75"><rect x="5" y="5" width="30" height="30" rx="4" fill="#ffaa22"/></svg>`,//积木橙
  `<svg width="75" height="75" viewBox="0 0 75 75"><rect x="5" y="5" width="30" height="30" rx="4" fill="#39cc77"/></svg>`,//积木绿
  `<svg width="75" height="75" viewBox="0 0 75 75"><rect x="5" y="5" width="30" height="30" rx="4" fill="#5588ff"/></svg>`,//积木蓝
  `<div style="font-size:32px;font-weight:bold;color:#ff6020">可乐生日快乐✨</div>`,
  `<svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" fill="#ffdd44"/><path d="M28,34 Q40,48 52,34" stroke="#222" stroke-width="3" fill="none"/><circle cx="28" cy="28" r="4" fill="#222"/><circle cx="52" cy="28" r="4" fill="#222"/></svg>`//笑脸
];

//点击屏幕生成随机元素
document.body.addEventListener('click',(e)=>{
  const el = document.createElement('div');
  el.className = "float-item";
  const randomPick = itemList[Math.floor(Math.random()*itemList.length)];
  el.innerHTML = randomPick;
  el.style.left = `${e.clientX}px`;
  el.style.top = `${e.clientY}px`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
})

//触屏兼容（手机）
document.body.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  const touch = e.touches[0];
  const el = document.createElement('div');
  el.className = "float-item";
  const randomPick = itemList[Math.floor(Math.random()*itemList.length)];
  el.innerHTML = randomPick;
  el.style.left = `${touch.clientX}px`;
  el.style.top = `${touch.clientY}px`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
},{passive:false})
</script>
</body>
</html>
